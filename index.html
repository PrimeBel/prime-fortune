<div id="main-screen">
 <h1>PRIME FORTUNE</h1>
 <div class="subtitle">YOUR LUCK · YOUR FORTUNE</div>

 <div class="card">
  <h2>КОЛЕСО ФОРТУНЫ</h2>
  <svg id="wheel" viewBox="0 0 340 340">
   <g id="slices"></g>
   <circle cx="170" cy="170" r="35" fill="#f3cf78" stroke="#fff0b4" stroke-width="5"/>
   <text x="170" y="178" text-anchor="middle" font-size="19" font-weight="bold" fill="#291b08">PF</text>
  </svg>

  <button id="spin" disabled>КРУТИТЬ</button>

<script>
const SUPABASE_URL = "https://wbcyekplhoahrzcetlak.supabase.co";

const defaultPrizes = [
 "10 БОНУСОВ",
 "25 БОНУСОВ",
 "50 БОНУСОВ",
 "100 БОНУСОВ",
 "200 БОНУСОВ",
 "500 БОНУСОВ",
 "ПОПРОБУЙ ЕЩЁ",
 "ДЖЕКПОТ"
];

const colors = [
 "#bd852b","#35250e","#e0b65c","#493112",
 "#d19a3e","#281d10","#b9822e","#4c3515"
];

let prizeRows = [];
let prizes = [...defaultPrizes];
let rotation = 0;
let busy = false;
let initData = "";
let authReady = false;

const g = document.getElementById("slices");
const wheel = document.getElementById("wheel");
const button = document.getElementById("spin");
const resultBox = document.getElementById("result");
const statusBox = document.getElementById("auth-status");

function normalize(value){
 return String(value || "")
  .toLowerCase()
  .replaceAll("ё","е")
  .replace(/\s+/g," ")
  .trim();
}

function getPrizeName(prize){
 if(typeof prize === "string") return prize;
 if(prize && typeof prize === "object"){
  return prize.name || prize.prize_name || prize.title || prize.label || "";
 }
 return "";
}

function escapeHtml(value){
 return String(value ?? "").replace(/[&<>"']/g, char => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[char]));
}

async function adminRequest(payload = {}){
 const response = await fetch(
  SUPABASE_URL + "/functions/v1/admin-panel",
  {
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({initData,...payload})
  }
 );

 const data = await response.json();

 if(!response.ok || !data.success){
  throw new Error(data.error || "Ошибка запроса");
 }

 return data;
}

function drawWheel(){
 g.innerHTML = "";

 if(!prizes.length) return;

 const segment = 2*Math.PI/prizes.length;

 prizes.forEach((p,i)=>{
  const a = i*segment-Math.PI/2;
  const b = (i+1)*segment-Math.PI/2;

  const x1 = 170+160*Math.cos(a);
  const y1 = 170+160*Math.sin(a);
  const x2 = 170+160*Math.cos(b);
  const y2 = 170+160*Math.sin(b);

  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",`M170 170 L${x1} ${y1} A160 160 0 0 1 ${x2} ${y2} Z`);
  path.setAttribute("fill",colors[i%colors.length]);
  path.setAttribute("stroke","#f5d58a");
  path.setAttribute("stroke-width","2");
  g.appendChild(path);

  const angle = (i+.5)*segment-Math.PI/2;
  const t = document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x",170+105*Math.cos(angle));
  t.setAttribute("y",170+105*Math.sin(angle));
  t.setAttribute("text-anchor","middle");
  t.setAttribute("dominant-baseline","middle");
  t.setAttribute("fill","#fff0c4");
  t.setAttribute("font-size",prizes.length>8?"9":"11");
  t.setAttribute("font-weight","bold");
  t.textContent = p;
  g.appendChild(t);
 });
}

async function loadPrizeData(){
 try{
  const data = await adminRequest({action:"list_prizes"});

  prizeRows = Array.isArray(data.prizes) ? data.prizes : [];

  const available = prizeRows.filter(p =>
   p.is_active === true && (p.stock === null || Number(p.stock)>0)
  );

  if(available.length){
   prizes = available.map(p => p.name);
   drawWheel();
  }

 }catch(error){
  console.error("Prize loading failed:",error);
 }
}

async function checkAdmin(){
 try{
  const data = await adminRequest({action:"check"});

  if(data.is_admin){
   document.getElementById("admin-area").style.display = "block";
  }
 }catch(error){
  console.error("Admin check failed",error);
 }
}

async function loadAdminPrizes(){
 const area = document.getElementById("admin-section");
 area.innerHTML = `
  <div class="admin-section">
   <h3 style="color:#f5ca63;">🎁 УПРАВЛЕНИЕ ПРИЗАМИ</h3>
   <p>Загружаем призы...</p>
  </div>
 `;

 try{
  const data = await adminRequest({action:"list_prizes"});
  prizeRows = Array.isArray(data.prizes) ? data.prizes : [];

  if(!prizeRows.length){
   area.innerHTML = '<div class="admin-section">Призы не найдены.</div>';
   return;
  }

  area.innerHTML = `
   <div class="admin-section">
    <h3 style="color:#f5ca63;">🎁 УПРАВЛЕНИЕ ПРИЗАМИ</h3>
    <p>Измени параметры и нажми «СОХРАНИТЬ» у нужного приза.</p>
    <div id="prize-list"></div>
    <div id="prize-message" class="admin-message" aria-live="polite"></div>
   </div>
  `;

  const list = document.getElementById("prize-list");

  prizeRows.forEach(prize=>{
   const card = document.createElement("div");
   card.className = "prize-editor";

   card.innerHTML = `
    <h4>${escapeHtml(prize.name)}</h4>

    <label>Название приза</label>
    <input class="admin-input" id="prize-name-${prize.id}"
     value="${escapeHtml(prize.name)}" maxlength="100">

    <label>Описание</label>
    <input class="admin-input" id="prize-description-${prize.id}"
     value="${escapeHtml(prize.description || "")}" maxlength="500">

    <label>Вес выпадения (0–100000)</label>
    <input class="admin-input" id="prize-weight-${prize.id}"
     type="number" min="0" max="100000" step="1"
     value="${Number(prize.weight)}">

    <label>Остаток (пусто = без ограничения)</label>
    <input class="admin-input" id="prize-stock-${prize.id}"
     type="number" min="0" step="1"
     value="${prize.stock === null ? "" : Number(prize.stock)}"
     placeholder="Без ограничения">

    <label class="active-row">
     <input id="prize-active-${prize.id}" type="checkbox"
      ${prize.is_active ? "checked" : ""}>
     Приз активен
    </label>

    <button class="prize-save" type="button"
     data-prize-id="${prize.id}">
     СОХРАНИТЬ
    </button>
   `;

   list.appendChild(card);
  });

  list.querySelectorAll(".prize-save").forEach(btn=>{
   btn.addEventListener("click",()=>{
    savePrize(btn.dataset.prizeId,btn);
   });
  });

 }catch(error){
  area.innerHTML = `
   <div class="admin-section">
    <h3 style="color:#f5ca63;">Ошибка загрузки призов</h3>
    <p>${escapeHtml(error.message)}</p>
    <button onclick="loadAdminPrizes()">ПОВТОРИТЬ</button>
   </div>
  `;
 }
}

async function savePrize(id,saveButton){
 const output = document.getElementById("prize-message");

 const name = document.getElementById("prize-name-"+id).value.trim();
 const description = document.getElementById("prize-description-"+id).value;
 const weight = Number(document.getElementById("prize-weight-"+id).value);
 const stockValue = document.getElementById("prize-stock-"+id).value;
 const isActive = document.getElementById("prize-active-"+id).checked;

 const stock = stockValue.trim() === "" ? null : Number(stockValue);

 if(!name){
  output.textContent = "Укажи название приза.";
  return;
 }

 if(!Number.isInteger(weight) || weight<0 || weight>100000){
  output.textContent = "Вес должен быть от 0 до 100000.";
  return;
 }

 if(stock!==null && (!Number.isInteger(stock) || stock<0)){
  output.textContent = "Остаток должен быть целым числом не меньше нуля.";
  return;
 }

 saveButton.disabled = true;
 output.textContent = "Сохраняем изменения...";

 try{
  await adminRequest({
   action:"update_prize",
   prize_id:id,
   name,
   description,
   weight,
   stock,
   is_active:isActive
  });

  output.textContent = "✓ Изменения сохранены!";
  await loadPrizeData();
  await loadAdminPrizes();

  const refreshed = document.getElementById("prize-message");
  if(refreshed) refreshed.textContent = "✓ Изменения сохранены!";

 }catch(error){
  output.textContent = "Ошибка: " + error.message;
  saveButton.disabled = false;
 }
}

/* ИСТОРИЯ И СТАТИСТИКА */
async function loadSpinHistory(){
 const list = document.getElementById("history-list");
 if(!list) return;

 list.innerHTML = "Загружаем историю и статистику...";

 try{
  const data = await adminRequest({action:"list_spins"});
  const spins = Array.isArray(data.spins) ? data.spins : [];

  /* Считаем уникальных игроков */
  const players = new Set(
   spins.map(s => String(s.user_telegram_id))
  );

  /* Считаем выпадения каждого приза */
  const prizeCounts = {};

  spins.forEach(s=>{
   const name = s.prize_name || "Приз не указан";
   prizeCounts[name] = (prizeCounts[name] || 0) + 1;
  });

  /* Находим самый популярный приз */
  const sortedPrizes = Object.entries(prizeCounts)
   .sort((a,b)=>b[1]-a[1]);

  const popularPrize = sortedPrizes.length
   ? sortedPrizes[0]
   : null;

  /* Формируем статистику */
  const stats = document.createElement("div");
  stats.className = "stats-card";

  stats.innerHTML = `
   <h3>📊 ОБЩАЯ СТАТИСТИКА</h3>

   <div style="display:flex;justify-content:space-around;gap:10px;text-align:center;">
    <div>
     <div class="stats-number">${spins.length}</div>
     <div class="stats-label">ВРАЩЕНИЙ</div>
    </div>
    <div>
     <div class="stats-number">${players.size}</div>
     <div class="stats-label">ИГРОКОВ</div>
    </div>
   </div>

   <div style="margin-top:18px;text-align:center;">
    <div class="stats-label">🏆 САМЫЙ ПОПУЛЯРНЫЙ ПРИЗ</div>
    <div style="color:#ffe29a;font-size:19px;font-weight:bold;margin-top:7px;">
     ${popularPrize ? escapeHtml(popularPrize[0]) : "Пока нет данных"}
    </div>
    <div class="stats-label" style="margin-top:5px;">
     Выпадал ${popularPrize ? popularPrize[1] : 0} раз
    </div>
   </div>

   <p style="font-size:11px;text-align:center;color:#9d8962;margin-bottom:0;">
    Статистика по последним 200 вращениям
   </p>
  `;

  list.innerHTML = "";
  list.appendChild(stats);

  /* Таблица частоты выпадения призов */
  const breakdown = document.createElement("div");
  breakdown.className = "stats-card";

  breakdown.innerHTML = `
   <h3>🎁 ПОПУЛЯРНОСТЬ ПРИЗОВ</h3>
   <div id="prize-statistics"></div>
  `;

  list.appendChild(breakdown);

  const prizeStatistics = breakdown.querySelector("#prize-statistics");

  if(!sortedPrizes.length){
   prizeStatistics.innerHTML = '<p>Пока нет данных о призах.</p>';
  }else{
   sortedPrizes.forEach(([name,count])=>{
    const percent = spins.length
     ? (count/spins.length*100).toFixed(1)
     : "0.0";

    const row = document.createElement("div");
    row.className = "stats-prize-row";

    row.innerHTML = `
     <div style="flex:1;min-width:0;">
      <div style="color:#ffe29a;">${escapeHtml(name)}</div>
      <div class="stats-bar">
       <div class="stats-bar-fill" style="width:${percent}%;"></div>
      </div>
     </div>
     <div style="text-align:right;white-space:nowrap;">
      <div style="color:#f5ca63;font-weight:bold;">${count} раз</div>
      <div style="color:#9d8962;font-size:11px;">${percent}%</div>
     </div>
    `;

    prizeStatistics.appendChild(row);
   });
  }

  /* Список истории вращений */
  const historyTitle = document.createElement("h3");
  historyTitle.textContent = "📜 ПОСЛЕДНИЕ ВЫИГРЫШИ";
  historyTitle.style.color = "#f5ca63";
  historyTitle.style.marginTop = "24px";
  list.appendChild(historyTitle);

  if(!spins.length){
   const empty = document.createElement("p");
   empty.textContent = "Пока вращений нет.";
   list.appendChild(empty);
   return;
  }

  spins.forEach(spin=>{
   const item = document.createElement("div");
   item.className = "history-item";

   const date = spin.created_at
    ? new Date(spin.created_at).toLocaleString("ru-RU")
    : "Дата не указана";

   const playerId = spin.user_telegram_id ?? "Не указан";
   const prizeName = spin.prize_name || "Приз не указан";

   item.innerHTML = `
    <h4>🎁 ${escapeHtml(prizeName)}</h4>
    <p>👤 Telegram ID: ${escapeHtml(playerId)}</p>
    <p>🕒 Дата: ${escapeHtml(date)}</p>
    <p style="color:#8f754b;font-size:11px;">
     ID вращения: ${escapeHtml(spin.id || "")}
    </p>
   `;

   list.appendChild(item);
  });

 }catch(error){
  list.innerHTML = `
   <p style="color:#ff9b75;">
    Ошибка загрузки истории: ${escapeHtml(error.message)}
   </p>
  `;
 }
}

function showAdminSection(section){
 const area = document.getElementById("admin-section");

 if(section === "prizes"){
  loadAdminPrizes();
 }

 if(section === "attempts"){
  area.innerHTML = `
   <div class="admin-section">
    <h3 style="color:#f5ca63;">🎯 НАЧИСЛЕНИЕ ПОПЫТОК</h3>
    <p>Введи Telegram ID игрока и количество попыток.</p>

    <input id="grant-player-id" class="admin-input"
     type="number" inputmode="numeric"
     placeholder="Telegram ID игрока">

    <input id="grant-amount" class="admin-input"
     type="number" inputmode="numeric" min="1" max="10000"
     placeholder="Количество попыток">

    <button id="grant-button" type="button" style="width:100%;">
     НАЧИСЛИТЬ ПОПЫТКИ
    </button>

    <div id="grant-result" class="admin-message" aria-live="polite"></div>
   </div>
  `;

  document.getElementById("grant-button")
   .addEventListener("click",grantAttempts);
 }

 if(section === "history"){
  area.innerHTML = `
   <div class="admin-section">
    <h3 style="color:#f5ca63;">📜 ИСТОРИЯ И СТАТИСТИКА</h3>
    <p>Статистика и последние 200 вращений всех игроков.</p>
    <button id="history-refresh" type="button" style="width:100%;">
     ОБНОВИТЬ СТАТИСТИКУ
    </button>
    <div id="history-list" class="admin-message" aria-live="polite">
     Загружаем историю...
    </div>
   </div>
  `;

  document.getElementById("history-refresh")
   .addEventListener("click",loadSpinHistory);

  loadSpinHistory();
 }
}

async function grantAttempts(){
 const playerInput = document.getElementById("grant-player-id");
 const amountInput = document.getElementById("grant-amount");
 const output = document.getElementById("grant-result");
 const grantButton = document.getElementById("grant-button");

 const playerId = Number(playerInput.value);
 const amount = Number(amountInput.value);

 if(!Number.isSafeInteger(playerId) || playerId<=0){
  output.textContent = "Укажи правильный Telegram ID игрока.";
  return;
 }

 if(!Number.isInteger(amount) || amount<1 || amount>10000){
  output.textContent = "Количество попыток должно быть от 1 до 10000.";
  return;
 }

 if(!authReady || !initData){
  output.textContent = "Нет подтверждённой авторизации Telegram.";
  return;
 }

 grantButton.disabled = true;
 output.textContent = "Отправляем запрос...";

 try{
  await adminRequest({
   action:"grant_attempts",
   target_telegram_id:playerId,
   amount
  });

  output.textContent = "✓ Успешно начислено "+amount+
   " попыток игроку "+playerId+".";

  playerInput.value = "";
  amountInput.value = "";

 }catch(error){
  output.textContent = "Ошибка: "+error.message;
 }finally{
  grantButton.disabled = false;
 }
}

document.getElementById("admin-open").addEventListener("click",()=>{
 document.getElementById("main-screen").style.display = "none";
 document.getElementById("admin-open").style.display = "none";
 document.getElementById("admin-content").style.display = "block";
 document.getElementById("admin-section").innerHTML = "";
});

document.getElementById("admin-back").addEventListener("click",()=>{
 document.getElementById("main-screen").style.display = "block";
 document.getElementById("admin-open").style.display = "block";
 document.getElementById("admin-content").style.display = "none";
 document.getElementById("admin-section").innerHTML = "";
});

async function connectTelegram(){
 if(!window.Telegram || !Telegram.WebApp){
  statusBox.textContent = "Открой приложение через Telegram";
  return;
 }

 Telegram.WebApp.ready();
 Telegram.WebApp.expand();

 initData = Telegram.WebApp.initData;

 if(!initData){
  statusBox.textContent = "Нет данных авторизации Telegram";
  return;
 }

 try{
  const response = await fetch(
   SUPABASE_URL+"/functions/v1/telegram-auth",
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({initData})
   }
  );

  const data = await response.json();

  if(!response.ok){
   throw new Error(data.error || "Ошибка авторизации");
  }

  authReady = true;
  statusBox.textContent = "PRIME FORTUNE: подключено ✓";

  await loadPrizeData();

  button.disabled = prizes.length===0;
  await checkAdmin();

 }catch(error){
  statusBox.textContent = "Ошибка подключения: "+error.message;
 }
}

async function spin(){
 if(busy) return;

 if(!authReady || !initData){
  resultBox.textContent = "Сначала подключи Telegram";
  return;
 }

 busy = true;
 button.disabled = true;
 resultBox.textContent = "Удача выбирает...";

 try{
  const response = await fetch(
   SUPABASE_URL+"/functions/v1/telegram-spin",
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({initData})
   }
  );

  const data = await response.json();

  if(!response.ok){
   throw new Error(data.error || "Ошибка вращения");
  }

  const payload = Array.isArray(data) ? data[0] : data;

  if(payload.success===false){
   throw new Error(payload.error || "Не удалось выполнить вращение");
  }

  const prizeName = getPrizeName(payload.prize);
  const index = prizes.findIndex(p=>normalize(p)===normalize(prizeName));

  if(index<0){
   throw new Error("Сервер вернул неизвестный приз: "+prizeName);
  }

  const segment = 360/prizes.length;
  const target = 360*6+(360-index*segment-segment/2);

  rotation += target;
  wheel.style.transform = `rotate(${rotation}deg)`;

  setTimeout(()=>{
   resultBox.textContent = "Выпало: "+prizes[index]+"!";

   if(payload.remaining_attempts!==undefined){
    resultBox.textContent += " Осталось попыток: "+payload.remaining_attempts;
   }

   busy = false;
   button.disabled = false;
  },5100);

 }catch(error){
  resultBox.textContent = error.message;
  busy = false;
  button.disabled = false;
 }
}

drawWheel();
button.addEventListener("click",spin);
connectTelegram();
</script>

</body>
</html>
