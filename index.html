
<!DOCTYPE html>
<html lang="ru">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRIME FORTUNE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:#f8e7b0;
 font-family:Arial,sans-serif;text-align:center;
 background:radial-gradient(circle at top,#34230e,#090909 65%);
 padding:25px 15px;
}
h1{font-size:32px;letter-spacing:5px;color:#f5ca63;margin:18px 0 5px}
.subtitle{color:#c6a96a;letter-spacing:3px;font-size:12px}
.card{
 max-width:440px;margin:25px auto;padding:22px 15px;
 border:1px solid #a77b32;border-radius:22px;
 background:linear-gradient(145deg,#21190e,#090909);
 box-shadow:0 0 35px #b17a2633;
}
#wheel{
 width:min(82vw,340px);height:min(82vw,340px);
 border-radius:50%;margin:12px auto 22px;
 border:8px solid #d4a544;
 box-shadow:0 0 0 5px #513a17,0 0 35px #d69b3b66;
 transition:transform 5s cubic-bezier(.12,.75,.12,1);
}
button{
 border:0;border-radius:12px;padding:17px 20px;
 background:linear-gradient(135deg,#ffe29a,#b77b20);
 color:#211405;font-weight:bold;font-size:15px;
 letter-spacing:1px;cursor:pointer;
 box-shadow:0 5px 20px #d69b3b55;
}
button:disabled{opacity:.6}
#result{font-size:20px;margin:20px 0;color:#ffe29a;min-height:28px}
.note{font-size:12px;color:#a9956c;line-height:1.6}
.admin-button{width:100%;margin:10px 0}
.admin-content{
 display:none;color:#f8e7b0;margin:20px auto;
 max-width:440px;
}
.admin-content h2{color:#f5ca63}
.admin-section{
 margin-top:20px;padding:15px;
 border:1px solid #a77b32;border-radius:15px;
 background:#21190e;
}
.admin-section p{line-height:1.6;color:#c6a96a}
.admin-input{
 display:block;width:100%;margin:12px 0;padding:14px;
 border:1px solid #a77b32;border-radius:10px;
 background:#090909;color:#ffe29a;font-size:16px;
 outline:none;
}
.admin-input::placeholder{color:#9d8962}
.admin-message{
 min-height:24px;margin-top:14px;line-height:1.5;
 color:#ffe29a;font-size:14px;overflow-wrap:anywhere;
}
</style>
</head>
<body>

<div id="auth-status" style="color:#d4af37;text-align:center;padding:10px;">
Подключение к PRIME FORTUNE...
</div>

<div id="admin-area" style="display:none;max-width:440px;margin:15px auto;">
 <button id="admin-open" style="width:100%;">
  АДМИН-ПАНЕЛЬ
 </button>

 <div id="admin-content" class="admin-content">
  <h2>УПРАВЛЕНИЕ ИГРОЙ</h2>

  <button class="admin-button" onclick="showAdminSection('prizes')">
   🎁 УПРАВЛЕНИЕ ПРИЗАМИ
  </button>

  <button class="admin-button" onclick="showAdminSection('attempts')">
   🎯 НАЧИСЛЕНИЕ ПОПЫТОК
  </button>

  <button class="admin-button" onclick="showAdminSection('history')">
   📜 ИСТОРИЯ ВЫИГРЫШЕЙ
  </button>

  <div id="admin-section"></div>

  <button id="admin-back" style="width:100%;margin-top:20px;">
   ← НАЗАД К КОЛЕСУ
  </button>
 </div>
</div>

<div id="main-screen">
 <h1>PRIME FORTUNE</h1>
 <div class="subtitle">YOUR LUCK · YOUR FORTUNE</div>

 <div class="card">
  <h2>КОЛЕСО ФОРТУНЫ</h2>

  <svg id="wheel" viewBox="0 0 340 340">
   <g id="slices"></g>
   <circle cx="170" cy="170" r="35" fill="#f3cf78" stroke="#fff0b4" stroke-width="5"/>
   <text x="170" y="178" text-anchor="middle" font-size="19" font-weight="bold" fill="#291b08">PF</text>
  </svg>

  <button id="spin" disabled>КРУТИТЬ</button>
  <div id="result">Твоя удача уже рядом!</div>
  <div class="note">Результаты определяются и сохраняются на сервере.</div>
 </div>
</div>

<script>
const SUPABASE_URL = "https://wbcyekplhoahrzcetlak.supabase.co";

const prizes = [
 "10 БОНУСОВ",
 "25 БОНУСОВ",
 "50 БОНУСОВ",
 "100 БОНУСОВ",
 "200 БОНУСОВ",
 "500 БОНУСОВ",
 "ПОПРОБУЙ ЕЩЁ",
 "ДЖЕКПОТ"
];

const colors = [
 "#bd852b","#35250e","#e0b65c","#493112",
 "#d19a3e","#281d10","#b9822e","#4c3515"
];

const g = document.getElementById("slices");
const wheel = document.getElementById("wheel");
const button = document.getElementById("spin");
const resultBox = document.getElementById("result");
const statusBox = document.getElementById("auth-status");

let rotation = 0;
let busy = false;
let initData = "";
let authReady = false;

function drawWheel(){
 g.innerHTML = "";

 prizes.forEach((p,i)=>{
  const a = i*Math.PI/4-Math.PI/2;
  const b = (i+1)*Math.PI/4-Math.PI/2;

  const x1 = 170+160*Math.cos(a);
  const y1 = 170+160*Math.sin(a);
  const x2 = 170+160*Math.cos(b);
  const y2 = 170+160*Math.sin(b);

  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",`M170 170 L${x1} ${y1} A160 160 0 0 1 ${x2} ${y2} Z`);
  path.setAttribute("fill",colors[i]);
  path.setAttribute("stroke","#f5d58a");
  path.setAttribute("stroke-width","2");
  g.appendChild(path);

  const angle = (i+.5)*Math.PI/4-Math.PI/2;
  const t = document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x",170+105*Math.cos(angle));
  t.setAttribute("y",170+105*Math.sin(angle));
  t.setAttribute("text-anchor","middle");
  t.setAttribute("dominant-baseline","middle");
  t.setAttribute("fill","#fff0c4");
  t.setAttribute("font-size","12");
  t.setAttribute("font-weight","bold");
  t.textContent = p;
  g.appendChild(t);
 });
}

function normalize(value){
 return String(value || "")
  .toLowerCase()
  .replaceAll("ё","е")
  .replace(/\s+/g," ")
  .trim();
}

function getPrizeName(prize){
 if(typeof prize === "string") return prize;

 if(prize && typeof prize === "object"){
  return prize.name ||
         prize.prize_name ||
         prize.title ||
         prize.label ||
         "";
 }

 return "";
}

async function checkAdmin(){
 try{
  const response = await fetch(
   SUPABASE_URL + "/functions/v1/admin-panel",
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({initData})
   }
  );

  const data = await response.json();

  if(response.ok && data.success && data.is_admin){
   document.getElementById("admin-area").style.display = "block";
  }
 }catch(error){
  console.error("Admin check failed", error);
 }
}

function showAdminSection(section){
 const area = document.getElementById("admin-section");

 if(section === "prizes"){
  area.innerHTML = `
   <div class="admin-section">
    <h3 style="color:#f5ca63;">🎁 УПРАВЛЕНИЕ ПРИЗАМИ</h3>
    <p>Здесь будет редактирование названий, вероятностей и остатков призов.</p>
   </div>
  `;
 }

 if(section === "attempts"){
  area.innerHTML = `
   <div class="admin-section">
    <h3 style="color:#f5ca63;">🎯 НАЧИСЛЕНИЕ ПОПЫТОК</h3>
    <p>Введи Telegram ID игрока и количество попыток, которые нужно начислить.</p>

    <input
     id="grant-player-id"
     class="admin-input"
     type="number"
     inputmode="numeric"
     placeholder="Telegram ID игрока"
    >

    <input
     id="grant-amount"
     class="admin-input"
     type="number"
     inputmode="numeric"
     min="1"
     max="10000"
     placeholder="Количество попыток"
    >

    <button id="grant-button" type="button" style="width:100%;">
     НАЧИСЛИТЬ ПОПЫТКИ
    </button>

    <div id="grant-result" class="admin-message" aria-live="polite"></div>
   </div>
  `;

  document.getElementById("grant-button")
   .addEventListener("click", grantAttempts);
 }

 if(section === "history"){
  area.innerHTML = `
   <div class="admin-section">
    <h3 style="color:#f5ca63;">📜 ИСТОРИЯ ВЫИГРЫШЕЙ</h3>
    <p>Здесь будет отображаться история вращений и призов игроков.</p>
   </div>
  `;
 }
}

async function grantAttempts(){
 const playerInput = document.getElementById("grant-player-id");
 const amountInput = document.getElementById("grant-amount");
 const output = document.getElementById("grant-result");
 const grantButton = document.getElementById("grant-button");

 const playerId = Number(playerInput.value);
 const amount = Number(amountInput.value);

 if(!Number.isSafeInteger(playerId) || playerId <= 0){
  output.textContent = "Укажи правильный Telegram ID игрока.";
  return;
 }

 if(!Number.isInteger(amount) || amount < 1 || amount > 10000){
  output.textContent = "Количество попыток должно быть от 1 до 10000.";
  return;
 }

 if(!authReady || !initData){
  output.textContent = "Нет подтверждённой авторизации Telegram.";
  return;
 }

 grantButton.disabled = true;
 output.textContent = "Отправляем запрос...";

 try{
  const response = await fetch(
   SUPABASE_URL + "/functions/v1/admin-panel",
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
     initData,
     action:"grant_attempts",
     target_telegram_id:playerId,
     amount:amount
    })
   }
  );

  const data = await response.json();

  if(!response.ok || !data.success){
   throw new Error(data.error || "Не удалось начислить попытки.");
  }

  output.textContent = "✓ Успешно начислено " + amount +
   " попыток игроку " + playerId + ".";

  playerInput.value = "";
  amountInput.value = "";

 }catch(error){
  output.textContent = "Ошибка: " + error.message;
 }finally{
  grantButton.disabled = false;
 }
}

document.getElementById("admin-open").addEventListener("click",()=>{
 document.getElementById("main-screen").style.display = "none";
 document.getElementById("admin-open").style.display = "none";
 document.getElementById("admin-content").style.display = "block";
 document.getElementById("admin-section").innerHTML = "";
});

document.getElementById("admin-back").addEventListener("click",()=>{
 document.getElementById("main-screen").style.display = "block";
 document.getElementById("admin-open").style.display = "block";
 document.getElementById("admin-content").style.display = "none";
 document.getElementById("admin-section").innerHTML = "";
});

async function connectTelegram(){
 if(!window.Telegram || !Telegram.WebApp){
  statusBox.textContent = "Открой приложение через Telegram";
  return;
 }

 Telegram.WebApp.ready();
 Telegram.WebApp.expand();

 initData = Telegram.WebApp.initData;

 if(!initData){
  statusBox.textContent = "Нет данных авторизации Telegram";
  return;
 }

 try{
  const response = await fetch(
   SUPABASE_URL + "/functions/v1/telegram-auth",
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({initData})
   }
  );

  const data = await response.json();

  if(!response.ok){
   throw new Error(data.error || "Ошибка авторизации");
  }

  authReady = true;
  button.disabled = false;
  statusBox.textContent = "PRIME FORTUNE: подключено ✓";

  await checkAdmin();

 }catch(error){
  statusBox.textContent = "Ошибка подключения: " + error.message;
 }
}

async function spin(){
 if(busy) return;

 if(!authReady || !initData){
  resultBox.textContent = "Сначала подключи Telegram";
  return;
 }

 busy = true;
 button.disabled = true;
 resultBox.textContent = "Удача выбирает...";

 try{
  const response = await fetch(
   SUPABASE_URL + "/functions/v1/telegram-spin",
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({initData})
   }
  );

  const data = await response.json();

  if(!response.ok){
   throw new Error(data.error || "Ошибка вращения");
  }

  const payload = Array.isArray(data) ? data[0] : data;

  if(payload.success === false){
   throw new Error(payload.error || "Не удалось выполнить вращение");
  }

  const prizeName = getPrizeName(payload.prize);
  const index = prizes.findIndex(
   p => normalize(p) === normalize(prizeName)
  );

  if(index < 0){
   throw new Error("Сервер вернул неизвестный приз: " + prizeName);
  }

  const segment = 360 / prizes.length;
  const target = 360*6 + (360-index*segment-segment/2);

  rotation += target;
  wheel.style.transform = `rotate(${rotation}deg)`;

  setTimeout(()=>{
   resultBox.textContent = "Выпало: " + prizes[index] + "!";

   if(payload.remaining_attempts !== undefined){
    resultBox.textContent +=
     " Осталось попыток: " + payload.remaining_attempts;
   }

   busy = false;
   button.disabled = false;
  },5100);

 }catch(error){
  resultBox.textContent = error.message;
  busy = false;
  button.disabled = false;
 }
}

drawWheel();
button.addEventListener("click",spin);
connectTelegram();
</script>

</body>
</html>
